<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id = "parag1">This is my practical examination</p> <br>
     <button id = "btn1">Welcome to IT10</button>
     <button id = "btn2">Change Color</button>
     <script>
       let par1 = document.getElementById('parag1');
       let button1 = document.querySelector("#btn1");
        let button2 = document.querySelector("#btn2");
       button1.addEventListener("click", function (){
        alert ("Button 1 triggered")
       });
        button2.addEventListener("dblclick", function (){
        parag1.style.color = "red";
       });


       
    </script>
</body>
</html>
